id = "whisper"
name = "Whisper"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Keeps agent-to-agent conversations from silently dying: logs herdr agent prompts, and when an agent returns an LLM decides whether to forward, resend, nudge or call you"
platforms = ["linux", "macos"]

# Catch up on timeouts after a restart.
[[startup]]
command = ["python3", "bin/whisper", "hook"]

# The loop. Each agent status change spawns one short-lived hook process;
# state lives in the JSONL log, so there is no daemon.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "bin/whisper", "hook"]

[[events]]
on = "pane.closed"
command = ["python3", "bin/whisper", "hook"]

[[events]]
on = "pane.exited"
command = ["python3", "bin/whisper", "hook"]

[[events]]
on = "pane.moved"
command = ["python3", "bin/whisper", "hook"]

# Live view of the conversation.
[[panes]]
id = "feed"
title = "Whisper"
placement = "split"
command = ["python3", "bin/whisper", "feed"]

[[actions]]
id = "feed"
title = "Whisper: open message feed"
contexts = ["workspace"]
command = ["python3", "bin/whisper", "open-feed"]

[[actions]]
id = "sweep"
title = "Whisper: check overdue replies now"
contexts = ["workspace"]
command = ["python3", "bin/whisper", "sweep"]

[[actions]]
id = "install"
title = "Whisper: install the herdr shim (adds one PATH line to ~/.bashrc / ~/.zshrc)"
contexts = ["workspace"]
command = ["python3", "bin/whisper", "install", "--rc"]
